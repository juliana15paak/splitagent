
name: Sync Frontend from IBM-SplitAgent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          repository: Tiasgod/IBM-SplitAgent
          ref: main
          path: upstream

      - name: Synchronize frontend
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            upstream/frontend/ ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to synchronize."
            exit 0
          fi

          git commit -m "chore: sync frontend from IBM-SplitAgent"
          git push origin main
