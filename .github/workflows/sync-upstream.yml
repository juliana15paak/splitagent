
name: Sync Frontend from IBM-SplitAgent

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Clone original repository
        run: |
          git clone --depth 1 --branch main \
            https://github.com/Tiasgod/IBM-SplitAgent.git \
            "$RUNNER_TEMP/IBM-SplitAgent"

      - name: Synchronize frontend
        run: |
          rsync -av --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/README.md' \
            --exclude='/.vercel/' \
            "$RUNNER_TEMP/IBM-SplitAgent/frontend/" \
            ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to synchronize."
            exit 0
          fi

          git commit -m "chore: sync frontend from IBM-SplitAgent"

          git push origin main
